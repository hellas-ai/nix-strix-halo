version: 2
updates:
  - package-ecosystem: "nix"
    directories:
      - "/"
      - "/lib/hydra/benchmark"
    schedule:
      interval: "daily"
      time: "07:00"
      timezone: "Etc/UTC"
    # Keep stalled engine updates from filling the queue before core inputs.
    open-pull-requests-limit: 20
    groups:
      nix-inputs:
        patterns:
          - "*"
        group-by: "dependency-name"
    ignore:
      # MLX shares a native ABI with the pinned vLLM Metal release wheel.
      # Update its source and pkgs/vllm-metal/uv.lock together after the
      # wheel adopts that MLX release; source-only bumps cannot build.
      - dependency-name: "mlx-metal-src"
      # TheRock source inputs are generated from pkgs/therock/sources/rocm-source.json
      # and must be bumped atomically by pkgs/therock/scripts/update-source-tree.py.
      - dependency-name: "therock-src-*"
      # GitHub Dependabot's Nix updater does not currently support private inputs.
      - dependency-name: "thunderbolt-ibverbs"
