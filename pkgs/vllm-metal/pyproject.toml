[project]
name = "vllm-metal-environment"
version = "0.29.0"
requires-python = "==3.12.*"
dependencies = [
  # Retain Ray for upstream executor imports; this package serves one Mac.
  "ray",
  "vllm @ https://github.com/vllm-project/vllm/releases/download/v0.29.0/vllm-0.29.0%2Bcpu-cp312-cp312-macosx_11_0_arm64.whl",
  "vllm-metal @ https://github.com/vllm-project/vllm-metal/releases/download/v0.29.0/vllm_metal-0.29.0-cp312-cp312-macosx_15_0_arm64.whl",
]

[tool.uv]
package = false
environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
]
required-environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.uv.extra-build-dependencies]
mlx-lm = ["setuptools"]
