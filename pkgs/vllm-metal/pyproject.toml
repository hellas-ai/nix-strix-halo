[project]
name = "vllm-metal-environment"
version = "0.3.0.dev20260826134128"
requires-python = "==3.12.*"
dependencies = [
  # vLLM-Metal uses Ray as the control plane for multi-Mac execution.
  "ray",
  "vllm @ https://github.com/vllm-project/vllm/releases/download/v0.28.0/vllm-0.28.0%2Bcpu-cp312-cp312-macosx_11_0_arm64.whl",
  "vllm-metal @ https://github.com/vllm-project/vllm-metal/releases/download/v0.3.0.dev20260826134128/vllm_metal-0.3.0.dev20260826134128-cp312-cp312-macosx_15_0_arm64.whl",
]

[tool.uv]
package = false
environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
]
required-environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.uv.extra-build-dependencies]
mlx-lm = ["setuptools"]
